---
- name: Update System
  hosts: workstations
  become: true
  tasks:
    - name: Turn off overlayroot in grub
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=.*'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash overlayroot=0"'
      notify:
        - update grub
        - reboot machine

    - name: Flush handlers to reboot before upgrade
      meta: flush_handlers

    - name: Run apt upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes

    - name: Re-enable overlayroot in grub
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=.*'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash overlayroot=tmpfs"'
      notify:
        - update grub
        - reboot machine

  handlers:
    - name: update grub
      ansible.builtin.command: update-grub

    - name: reboot machine
      ansible.builtin.reboot:
